services:
  # --- FastAPI Interception Proxy (entropy engine + Granite decoding) ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sentinel-backend-proxy
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      # Milvus Lite is an embedded single-file store; persist it across restarts.
      - ./data:/app/data
    networks:
      - sentinel-net

  # --- Next.js Security Terminal ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sentinel-security-terminal
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - sentinel-net

# The previous etcd + minio + milvus-standalone cluster was removed: the code
# connects to Milvus Lite (data/sentinel_milvus.db), so nothing ever dialled
# 19530 and the three services started only to sit idle. Add them back only if
# the retriever is repointed at a standalone Milvus URI.

networks:
  sentinel-net:
    driver: bridge
